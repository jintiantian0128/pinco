name: Verify CloudBase deployment

on:
  push:
    branches:
      - main
    paths:
      - backend/**
      - .github/workflows/verify-cloudbase-deploy.yml
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Type deploy to update the flask-jk7n production service
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pinco-cloudbase-production
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'push' || github.event.inputs.confirm_deploy == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out the exact deployment revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --requirement backend/requirements.txt

      - name: Run the complete backend test suite
        run: python -m unittest discover -s backend -p 'test_*.py'

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: pinco-miniapp/package-lock.json

      - name: Install mini-app dependencies from the lockfile
        working-directory: pinco-miniapp
        run: npm ci

      - name: Run critical mini-app flow checks
        working-directory: pinco-miniapp
        run: node critical-flows.test.mjs

      - name: Build the WeChat mini-app
        working-directory: pinco-miniapp
        run: npm run build:weapp

      - name: Stamp the immutable release fingerprint
        run: printf '%s\n' "$GITHUB_SHA" > backend/.pinco-release-sha

      - name: Build the exact backend container image
        run: docker build --file backend/Dockerfile --tag "pinco-backend:${GITHUB_SHA}" backend

  deploy:
    if: github.event_name == 'push' || github.event.inputs.confirm_deploy == 'deploy'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the tested main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Validate deployment secrets
        env:
          WXCLOUD_APP_ID: ${{ secrets.WXCLOUD_APP_ID }}
          WXCLOUD_PRIVATE_KEY: ${{ secrets.WXCLOUD_PRIVATE_KEY }}
        run: |
          missing=0
          for name in WXCLOUD_APP_ID WXCLOUD_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured in repository Actions secrets."
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Login to WeChat Cloud Hosting
        env:
          WXCLOUD_APP_ID: ${{ secrets.WXCLOUD_APP_ID }}
          WXCLOUD_PRIVATE_KEY: ${{ secrets.WXCLOUD_PRIVATE_KEY }}
        run: >-
          npx --yes @wxcloud/cli@2.3.3 login
          --appId "$WXCLOUD_APP_ID"
          --privateKey "$WXCLOUD_PRIVATE_KEY"

      - name: Discover the CloudBase environment
        id: cloudbase
        run: |
          raw="$(npx --yes @wxcloud/cli@2.3.3 env:list --json)"
          mapfile -t env_ids < <(ENV_LIST_RAW="$raw" node -e '
            const lines = (process.env.ENV_LIST_RAW || "").split(/\r?\n/).reverse();
            let payload;
            for (const line of lines) {
              const start = line.indexOf("{\"code\"");
              if (start < 0) continue;
              try { payload = JSON.parse(line.slice(start)); break; } catch {}
            }
            for (const item of payload?.data || []) {
              if (item.EnvId) process.stdout.write(`${item.EnvId}\n`);
            }
          ')
          matches=()
          for env_id in "${env_ids[@]}"; do
            if service_raw="$(npx --yes @wxcloud/cli@2.3.3 service:list \
              --envId "$env_id" \
              --serviceName flask-jk7n \
              --json)" && SERVICE_LIST_RAW="$service_raw" node -e '
                const lines = (process.env.SERVICE_LIST_RAW || "").split(/\r?\n/).reverse();
                let payload;
                for (const line of lines) {
                  const start = line.indexOf("{\"code\"");
                  if (start < 0) continue;
                  try { payload = JSON.parse(line.slice(start)); break; } catch {}
                }
                const found = (payload?.data || []).some(
                  item => item.ServerName === "flask-jk7n"
                );
                process.exit(found ? 0 : 1);
              '; then
              matches+=("$env_id")
            fi
          done
          if [ "${#matches[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one CloudBase environment containing flask-jk7n; found ${#matches[@]}."
            exit 1
          fi
          echo "env_id=${matches[0]}" >> "$GITHUB_OUTPUT"

      - name: Verify the production baseline
        id: baseline
        env:
          HEALTH_URL: https://flask-jk7n-277209-9-1430442234.sh.run.tcloudbase.com/health
        run: |
          for attempt in $(seq 1 6); do
            response="$(curl --fail --silent --show-error --max-time 45 "$HEALTH_URL" || true)"
            if version="$(HEALTH_RESPONSE="$response" node -e '
              const health = JSON.parse(process.env.HEALTH_RESPONSE || "{}");
              const ready = health.status === "online"
                && typeof health.version === "string"
                && health.version.length > 0
                && health.llm?.online === true
                && health.state?.durable === true
                && health.state?.online === true;
              if (!ready) process.exit(1);
              process.stdout.write(`${health.version}\n${health.release_sha || ""}`);
            ')"; then
              mapfile -t baseline < <(printf '%s\n' "$version")
              echo "version=${baseline[0]}" >> "$GITHUB_OUTPUT"
              echo "release_sha=${baseline[1]:-}" >> "$GITHUB_OUTPUT"
              printf '%s\n' "$response"
              exit 0
            fi
            printf 'Production baseline attempt %s/6 was not healthy.\n' "$attempt"
            sleep 10
          done
          echo "The existing production baseline did not become healthy within the acceptance window." >&2
          exit 1

      - name: Record the rollback version
        id: rollback_target
        env:
          WXCLOUD_ENV_ID: ${{ steps.cloudbase.outputs.env_id }}
        run: |
          raw="$(npx --yes @wxcloud/cli@2.3.3 version:list \
            --envId "$WXCLOUD_ENV_ID" \
            --serviceName flask-jk7n \
            --json)"
          VERSION_LIST_RAW="$raw" node -e '
            const lines = (process.env.VERSION_LIST_RAW || "").split(/\r?\n/).reverse();
            let payload;
            for (const line of lines) {
              const start = line.indexOf("{\"code\"");
              if (start < 0) continue;
              try { payload = JSON.parse(line.slice(start)); break; } catch {}
            }
            const target = payload?.data?.find(
              item => String(item.Status || "").toLowerCase() === "normal"
            );
            if (!target?.VersionName) process.exit(1);
            process.stdout.write(`version=${target.VersionName}\n`);
          ' >> "$GITHUB_OUTPUT"

      - name: Stamp the immutable release fingerprint
        run: printf '%s\n' "$GITHUB_SHA" > backend/.pinco-release-sha

      - name: Validate deployment plan
        working-directory: backend
        env:
          WXCLOUD_ENV_ID: ${{ steps.cloudbase.outputs.env_id }}
        run: >-
          npx --yes @wxcloud/cli@2.3.3 deploy
          --envId "$WXCLOUD_ENV_ID"
          --serviceName flask-jk7n
          --port 80
          --dryRun

      - name: Deploy backend
        id: deploy
        working-directory: backend
        env:
          WXCLOUD_ENV_ID: ${{ steps.cloudbase.outputs.env_id }}
        run: |
          set +e
          timeout --signal=TERM 12m npx --yes @wxcloud/cli@2.3.3 deploy \
            --envId "$WXCLOUD_ENV_ID" \
            --serviceName flask-jk7n \
            --port 80 2>&1 | tee "$RUNNER_TEMP/wxcloud-deploy.log"
          cli_exit_code=${PIPESTATUS[0]}
          set -e

          submitted=false
          if [ "$cli_exit_code" -eq 0 ] || grep -Fq "云托管 版本创建成功" "$RUNNER_TEMP/wxcloud-deploy.log"; then
            submitted=true
          fi
          echo "submitted=$submitted" >> "$GITHUB_OUTPUT"
          echo "cli_exit_code=$cli_exit_code" >> "$GITHUB_OUTPUT"

          if [ "$submitted" != true ]; then
            echo "::error::CloudBase did not confirm that a new version was submitted."
          elif [ "$cli_exit_code" -eq 124 ]; then
            echo "::warning::CloudBase accepted the release, but its CLI exceeded the 12-minute polling limit. Public health is the authoritative deployment gate."
          elif [ "$cli_exit_code" -ne 0 ]; then
            echo "::warning::CloudBase accepted the release, but its CLI could not finish polling build logs. Public health is the authoritative deployment gate."
          fi

      - name: Verify public health and deployed version
        id: health
        if: steps.deploy.outputs.submitted == 'true'
        continue-on-error: true
        env:
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
          HEALTH_URL: https://flask-jk7n-277209-9-1430442234.sh.run.tcloudbase.com/health
        run: |
          for attempt in $(seq 1 18); do
            response="$(curl --fail --silent --show-error --max-time 45 "$HEALTH_URL" || true)"
            if HEALTH_RESPONSE="$response" EXPECTED_RELEASE_SHA="$EXPECTED_RELEASE_SHA" node -e '
              const health = JSON.parse(process.env.HEALTH_RESPONSE || "{}");
              const ready = health.status === "online"
                && health.version === "0.7.0"
                && health.release_sha === process.env.EXPECTED_RELEASE_SHA
                && health.llm?.online === true
                && health.state?.durable === true
                && health.state?.online === true;
              process.exit(ready ? 0 : 1);
            '; then
              printf '%s\n' "$response"
              exit 0
            fi
            printf 'Attempt %s/18 has not reached the accepted production revision.\n' "$attempt"
            sleep 10
          done
          echo "CloudBase did not serve the exact healthy Pinco revision with DeepSeek and durable storage within the acceptance window." >&2
          exit 1

      - name: Verify public user journeys three times
        id: public_smoke
        if: steps.health.outcome == 'success'
        continue-on-error: true
        env:
          PUBLIC_BASE_URL: https://flask-jk7n-277209-9-1430442234.sh.run.tcloudbase.com
        run: |
          for attempt in 1 2 3; do
            echo "Public account journey $attempt/3"
            python backend/scripts/smoke_local_session.py "$PUBLIC_BASE_URL"
          done
          for attempt in 1 2 3; do
            echo "Public Agent memory journey $attempt/3"
            python backend/scripts/smoke_public_agent.py "$PUBLIC_BASE_URL"
          done
          for attempt in 1 2 3; do
            echo "Public local OCR journey $attempt/3"
            python backend/scripts/smoke_public_image_ocr.py "$PUBLIC_BASE_URL"
          done

      - name: Check whether rollback is required
        id: rollback_check
        if: always() && (steps.health.outcome != 'success' || steps.public_smoke.outcome != 'success')
        env:
          BASELINE_RELEASE_SHA: ${{ steps.baseline.outputs.release_sha }}
          BASELINE_VERSION: ${{ steps.baseline.outputs.version }}
          HEALTH_URL: https://flask-jk7n-277209-9-1430442234.sh.run.tcloudbase.com/health
        run: |
          response="$(curl --fail --silent --show-error --max-time 45 "$HEALTH_URL" || true)"
          if HEALTH_RESPONSE="$response" BASELINE_RELEASE_SHA="$BASELINE_RELEASE_SHA" BASELINE_VERSION="$BASELINE_VERSION" node -e '
            const health = JSON.parse(process.env.HEALTH_RESPONSE || "{}");
            const baselineSha = process.env.BASELINE_RELEASE_SHA || "";
            const sameRelease = baselineSha
              ? health.release_sha === baselineSha
              : !health.release_sha;
            const restored = health.status === "online"
              && health.version === process.env.BASELINE_VERSION
              && sameRelease
              && health.llm?.online === true
              && health.state?.durable === true
              && health.state?.online === true;
            process.exit(restored ? 0 : 1);
          '; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Roll back the failed production release
        if: steps.rollback_check.outputs.required == 'true'
        env:
          WXCLOUD_ENV_ID: ${{ steps.cloudbase.outputs.env_id }}
          ROLLBACK_VERSION: ${{ steps.rollback_target.outputs.version }}
        run: >-
          npx --yes @wxcloud/cli@2.3.3 run:rollback
          --envId "$WXCLOUD_ENV_ID"
          --serviceName flask-jk7n
          --version "$ROLLBACK_VERSION"
          --noConfirm

      - name: Verify production recovery
        id: recovery
        if: always() && (steps.health.outcome != 'success' || steps.public_smoke.outcome != 'success')
        env:
          BASELINE_RELEASE_SHA: ${{ steps.baseline.outputs.release_sha }}
          BASELINE_VERSION: ${{ steps.baseline.outputs.version }}
          HEALTH_URL: https://flask-jk7n-277209-9-1430442234.sh.run.tcloudbase.com/health
        run: |
          for attempt in $(seq 1 12); do
            response="$(curl --fail --silent --show-error --max-time 45 "$HEALTH_URL" || true)"
            if HEALTH_RESPONSE="$response" BASELINE_RELEASE_SHA="$BASELINE_RELEASE_SHA" BASELINE_VERSION="$BASELINE_VERSION" node -e '
              const health = JSON.parse(process.env.HEALTH_RESPONSE || "{}");
              const baselineSha = process.env.BASELINE_RELEASE_SHA || "";
              const sameRelease = baselineSha
                ? health.release_sha === baselineSha
                : !health.release_sha;
              const restored = health.status === "online"
                && health.version === process.env.BASELINE_VERSION
                && sameRelease
                && health.llm?.online === true
                && health.state?.durable === true
                && health.state?.online === true;
              process.exit(restored ? 0 : 1);
            '; then
              printf '%s\n' "$response"
              echo "The previous production version is healthy again."
              exit 0
            fi
            sleep 10
          done
          echo "Automatic recovery could not restore the verified production baseline." >&2
          exit 1

      - name: Finalize the deployment result
        if: always()
        env:
          DEPLOY_SUBMITTED: ${{ steps.deploy.outputs.submitted }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          PUBLIC_SMOKE_OUTCOME: ${{ steps.public_smoke.outcome }}
        run: |
          if [ "$DEPLOY_SUBMITTED" != true ]; then
            echo "CloudBase never confirmed release submission." >&2
            exit 1
          fi
          if [ "$HEALTH_OUTCOME" != success ]; then
            echo "The exact GitHub revision did not pass the public production health gate." >&2
            exit 1
          fi
          if [ "$PUBLIC_SMOKE_OUTCOME" != success ]; then
            echo "The exact GitHub revision did not pass all three public account, Agent, and local OCR journeys." >&2
            exit 1
          fi
          echo "The exact GitHub revision is healthy in production."

      - name: Logout from WeChat Cloud Hosting
        if: always()
        run: npx --yes @wxcloud/cli@2.3.3 logout || true
