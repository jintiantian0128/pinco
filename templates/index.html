<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>求职辅导Agent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .main-container {
            background: white;
            border-radius: 20px;
            margin: 20px auto;
            max-width: 1200px;
            min-height: 80vh;
        }
        .chat-container {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
        }
        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 10px;
        }
        .user-message {
            background: #007bff;
            color: white;
            margin-left: 20%;
        }
        .agent-message {
            background: #f8f9fa;
            margin-right: 20%;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="main-container">
            <div class="row">
                <div class="col-12">
                    <h1 class="text-center py-4">求职辅导Agent</h1>
                    
                    <ul class="nav nav-tabs" id="mainTabs" role="tablist">
                        <li class="nav-item">
                            <button class="nav-link active" id="chat-tab" data-bs-toggle="tab" data-bs-target="#chat">智能对话</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" id="jobs-tab" data-bs-toggle="tab" data-bs-target="#jobs">岗位推荐</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link" id="advice-tab" data-bs-toggle="tab" data-bs-target="#advice">求职建议</button>
                        </li>
                    </ul>
                    
                    <div class="tab-content p-4">
                        <!-- 智能对话 -->
                        <div class="tab-pane fade show active" id="chat">
                            <div class="chat-container" id="chatContainer">
                                <div class="text-center text-muted">
                                    <h4>欢迎使用求职辅导Agent！</h4>
                                    <p>我可以帮助您进行职业规划、岗位推荐和求职技能辅导。</p>
                                </div>
                            </div>
                            
                            <div class="input-group mt-3">
                                <input type="text" class="form-control" id="messageInput" placeholder="请输入您的问题...">
                                <button class="btn btn-primary" type="button" id="sendButton">发送</button>
                            </div>
                        </div>
                        
                        <!-- 岗位推荐 -->
                        <div class="tab-pane fade" id="jobs">
                            <div class="row">
                                <div class="col-md-4">
                                    <div class="card">
                                        <div class="card-header">搜索条件</div>
                                        <div class="card-body">
                                            <form id="jobSearchForm">
                                                <div class="mb-3">
                                                    <label>技能要求</label>
                                                    <input type="text" class="form-control" id="skillsInput" placeholder="如：Python, 机器学习">
                                                </div>
                                                <div class="mb-3">
                                                    <label>工作地点</label>
                                                    <input type="text" class="form-control" id="locationInput" placeholder="如：北京, 上海">
                                                </div>
                                                <button type="submit" class="btn btn-primary w-100">搜索岗位</button>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-8">
                                    <div id="jobResults">
                                        <div class="text-center text-muted py-5">
                                            <h4>请输入搜索条件</h4>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 求职建议 -->
                        <div class="tab-pane fade" id="advice">
                            <div class="row">
                                <div class="col-md-4">
                                    <div class="card">
                                        <div class="card-header">建议主题</div>
                                        <div class="card-body">
                                            <form id="adviceForm">
                                                <div class="mb-3">
                                                    <label>选择主题</label>
                                                    <select class="form-select" id="adviceTopic">
                                                        <option value="">请选择主题</option>
                                                        <option value="简历制作">简历制作</option>
                                                        <option value="面试技巧">面试技巧</option>
                                                        <option value="技能提升">技能提升</option>
                                                        <option value="职业规划">职业规划</option>
                                                    </select>
                                                </div>
                                                <button type="submit" class="btn btn-primary w-100">获取建议</button>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-8">
                                    <div id="adviceResults">
                                        <div class="text-center text-muted py-5">
                                            <h4>选择建议主题</h4>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 聊天功能
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');

        function addMessage(content, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'agent-message'}`;
            messageDiv.innerHTML = content;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;
            
            addMessage(message, true);
            messageInput.value = '';
            
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: message, context: {}})
                });
                
                const data = await response.json();
                if (data.status === 'success') {
                    addMessage(data.response);
                } else {
                    addMessage('抱歉，处理您的问题时出现了错误：' + data.error);
                }
            } catch (error) {
                addMessage('抱歉，网络连接出现问题，请稍后再试。');
            }
        }

        sendButton.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // 岗位推荐功能
        document.getElementById('jobSearchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const skills = document.getElementById('skillsInput').value.split(',').map(s => s.trim());
            const location = document.getElementById('locationInput').value;
            
            const jobResults = document.getElementById('jobResults');
            jobResults.innerHTML = '<div class="text-center">搜索中...</div>';
            
            try {
                const response = await fetch('/job_recommendations', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({skills: skills, location: location})
                });
                
                const data = await response.json();
                if (data.status === 'success') {
                    displayJobResults(data.recommendations);
                } else {
                    jobResults.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
                }
            } catch (error) {
                jobResults.innerHTML = '<div class="alert alert-danger">网络连接出现问题</div>';
            }
        });

        function displayJobResults(jobs) {
            const jobResults = document.getElementById('jobResults');
            if (jobs.length === 0) {
                jobResults.innerHTML = '<div class="alert alert-info">没有找到合适的岗位</div>';
                return;
            }
            
            let html = '';
            jobs.forEach(job => {
                html += `
                    <div class="card mb-3">
                        <div class="card-body">
                            <h5 class="card-title">${job.职位名称 || '未知职位'}</h5>
                            <h6 class="card-subtitle mb-2 text-muted">${job.公司名称 || '未知公司'}</h6>
                            <p class="card-text">地点：${job.工作地点 || '未知'}</p>
                            <p class="card-text">薪资：${job.薪资范围 || '面议'}</p>
                            <p class="card-text">要求：${job.技能要求 || '暂无'}</p>
                        </div>
                    </div>
                `;
            });
            jobResults.innerHTML = html;
        }

        // 求职建议功能
        document.getElementById('adviceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const topic = document.getElementById('adviceTopic').value;
            if (!topic) {
                alert('请选择建议主题');
                return;
            }
            
            const adviceResults = document.getElementById('adviceResults');
            adviceResults.innerHTML = '<div class="text-center">获取建议中...</div>';
            
            try {
                const response = await fetch('/career_advice', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({topic: topic})
                });
                
                const data = await response.json();
                if (data.status === 'success') {
                    adviceResults.innerHTML = `
                        <div class="card">
                            <div class="card-header">${topic}建议</div>
                            <div class="card-body">
                                <div style="white-space: pre-line;">${data.advice}</div>
                            </div>
                        </div>
                    `;
                } else {
                    adviceResults.innerHTML = `<div class="alert alert-danger">${data.error}</div>`;
                }
            } catch (error) {
                adviceResults.innerHTML = '<div class="alert alert-danger">网络连接出现问题</div>';
            }
        });
    </script>
</body>
</html>
